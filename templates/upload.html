<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Upload | NeuroShield AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header class="site-header"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">N</span> NEUROSHIELD <span class="brand-accent">AI</span></a><nav><a href="{{ url_for('index') }}">Home</a><a class="active" href="{{ url_for('upload') }}">Upload</a><a href="{{ url_for('live') }}">Live Camera</a><a href="{{ url_for('about') }}">About</a></nav></header>
